name: Build hm.tarot APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Extract Android project
        run: |
          echo "Looking for ZIP archive..."
          find . -maxdepth 3 -type f -iname "*.zip" -print
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found in repository"
            exit 1
          fi
          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted
          echo "Checking extracted files..."
          find extracted -maxdepth 3 -type f | head -80
          

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          

      - name: Build APK
        working-directory: extracted/hm_tarot_android_project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hm-tarot-android-apk
          path: extracted/hm_tarot_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
